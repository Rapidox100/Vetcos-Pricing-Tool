services:
  - type: web
    name: vetcos-quote-tool
    runtime: node
    plan: free
    buildCommand: npm run setup
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_EXPIRY
        value: 12h
      - key: NODE_VERSION
        value: 20.18.0
    disk:
      name: vetcos-data
      # Must match where server/src/lib/db.js writes the database
      # (resolved as <repo root>/server/data at runtime).
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
