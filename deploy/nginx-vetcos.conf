# Nginx site config for Vetcos Quote Tool, served at its own subdomain
# (vetcos.smstraining.in) on the same Lightsail instance as the other apps.
#
# Install as /etc/nginx/conf.d/vetcos.conf, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is the PLAIN HTTP version. Run deploy/enable-https-vetcos.sh afterwards
# to get it a real Let's Encrypt certificate (it edits this file automatically,
# same as was done for smstraining.in).

server {
    listen 80;
    listen [::]:80;
    server_name vetcos.smstraining.in;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
    }
}
